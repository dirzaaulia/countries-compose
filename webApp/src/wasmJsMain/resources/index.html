<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countries - 3D Space Globe</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #03060C;
        }
        #PlanetCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        #ComposeTarget {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #StartupSplash { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; background: #03060C; color: #e0f2fe; font: 600 14px sans-serif; letter-spacing: 0.14em; transition: opacity 180ms ease; }
        #StartupSplash.is-hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="PlanetCanvas"></canvas>
    <canvas id="ComposeTarget"></canvas>
    <div id="StartupSplash">INITIALIZING GLOBE</div>
    <script src="countries.js"></script>
</body>
</html>
