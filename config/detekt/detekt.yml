complexity:
  LargeClass:
    active: true
    threshold: 400           # Hard ceiling: files > 400 lines fail detekt!
  LongMethod:
    active: true
    threshold: 80            # Functions / composables > 80 lines fail!
  ComplexMethod:
    active: true
    threshold: 20
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 12
    ignoreDefaultParameters: true

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']  # Allows PascalCase for @Composable fun MyScreen()

style:
  WildcardImport:
    active: true             # Bans import foo.*
  UnusedImports:
    active: true             # Strips dead imports

Compose:
  ReusedModifierInstance:
    active: true
  UnnecessaryEventHandlerParameter:
    active: true
  ModifierMissing:
    active: true
  ComposableParamOrder:
    active: true
